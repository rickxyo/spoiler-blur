<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div>
      <h1>SpoilerBlur</h1>
      <p class="muted">Borra vídeos e posts por tema</p>
    </div>
    <label class="switch" title="Ligar/desligar a extensão">
      <input type="checkbox" id="enabled" aria-label="Ligar ou desligar a extensão" />
      <span class="slider"></span>
    </label>
  </header>

  <section>
    <h2>Temas</h2>
    <form id="form" class="field-row">
      <input type="text" id="kw" class="input" placeholder="Novo tema, ex.: One Piece" autocomplete="off" aria-label="Nome do novo tema" />
      <button type="submit" class="btn btn-primary">Criar</button>
    </form>
    <div class="groups" id="groups"></div>
  </section>

  <section>
    <h2>Sites</h2>
    <div class="sites">
      <label class="site-chip"><input type="checkbox" class="visually-hidden" data-site="youtube" /><span class="icon xs i-check"></span>YouTube</label>
      <label class="site-chip"><input type="checkbox" class="visually-hidden" data-site="x" /><span class="icon xs i-check"></span>X</label>
    </div>
  </section>

  <section>
    <h2 id="mode-label">Modo</h2>
    <div class="segmented" role="radiogroup" aria-labelledby="mode-label">
      <label><input type="radio" class="visually-hidden" name="mode" value="blur" />Borrar</label>
      <label><input type="radio" class="visually-hidden" name="mode" value="hide" />Esconder</label>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden>
    <span class="toast-msg" id="toast-msg"></span>
    <button type="button" class="btn btn-ghost btn-sm" id="toast-undo">Desfazer</button>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
